name: Release
on:
  push:
    tags:
      - "v*"
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: Build desktop app
        working-directory: cmd/agentmemory
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0
          wails build -trimpath
      - name: Package web extension
        shell: pwsh
        run: |
          $version = (Get-Content extension/manifest.json -Raw | ConvertFrom-Json).version
          $stage = "build/extension"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          $runtime = @("manifest.json","batch.html","batch.css","batch.js","popup.html","popup.css","popup.js","README.md")
          foreach ($file in $runtime) { Copy-Item "extension/$file" -Destination $stage }
          Copy-Item "extension/content" -Destination $stage -Recurse
          Copy-Item "extension/lib" -Destination $stage -Recurse
          Compress-Archive -Path "$stage/*" -DestinationPath "AgentMemory-Web-$version.zip" -Force
      - name: Package portable desktop
        shell: pwsh
        run: |
          $dir = "AgentMemory-portable"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Copy-Item "cmd/agentmemory/build/bin/AgentMemory.exe" "$dir/AgentMemory.exe"
          Copy-Item "PORTABLE-README.md" "$dir/README.md"
          Compress-Archive -Path "$dir/*" -DestinationPath "AgentMemory-$env:GITHUB_REF_NAME-portable.zip" -Force
      - name: Checksums
        shell: pwsh
        run: |
          $exe = "cmd/agentmemory/build/bin/AgentMemory.exe"
          $extensionZip = Get-ChildItem "AgentMemory-Web-*.zip" | Select-Object -First 1
          $portableZip = Get-ChildItem "AgentMemory-*-portable.zip" | Select-Object -First 1
          if (-not (Test-Path $exe)) { throw "AgentMemory.exe not found" }
          if (-not $extensionZip) { throw "extension zip not found" }
          if (-not $portableZip) { throw "portable zip not found" }
          @($exe, $extensionZip.FullName, $portableZip.FullName, "PORTABLE-README.md") | ForEach-Object {
            $hash = (Get-FileHash $_ -Algorithm SHA256).Hash.ToLower()
            "$hash  $(Split-Path $_ -Leaf)"
          } | Set-Content -Encoding ascii SHA256SUMS
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          body_path: PORTABLE-README.md
          files: |
            cmd/agentmemory/build/bin/AgentMemory.exe
            AgentMemory-*-portable.zip
            AgentMemory-Web-*.zip
            PORTABLE-README.md
            SHA256SUMS